# Done to increase the memory available to gradle.
org.gradle.jvmargs=-Xmx1G
org.gradle.parallel=true

# IntelliJ IDEA is not yet fully compatible with configuration cache, see: https://github.com/FabricMC/fabric-loom/issues/1349
org.gradle.configuration-cache=false

# Fabric Properties
# check these on https://fabricmc.net/develop
minecraft_version=1.20.1
yarn_mappings=1.20.1+build.10
loader_version=0.19.3
loom_version=1.17-SNAPSHOT

# Mod Properties
mod_version=20260805.10
maven_group=com.billy65536.debugger

# Dependencies
fabric_api_version=0.92.11+1.20.1

# Cloth Config / AutoConfig — 承载调试框架的配置持久化与 GUI（与主模组版本一致）
cloth_config_version=11.1.106

# ModMenu — 在模组列表中提供配置入口（可选依赖，与主模组版本一致）
modmenu_version=7.2.2

# Chunk Scanner — 仅编译期依赖（modCompileOnly），供 builtin.chunkscanner 内置包与其 Mixin 编译。
# 运行期不强制依赖：chunkscanner 缺失时本模组照常启动，相应内置包自动跳过注册。
# 通过 flatDir 读取 ../chunkscanner/build/libs 的本地构建产物
chunkscanner_group=com.billy65536
chunkscanner_artifact=chunkscanner
chunkscanner_default_version=1.1.0-rc.1-20260805.4
