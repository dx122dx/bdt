plugins {
	id 'net.fabricmc.fabric-loom-remap' version "${loom_version}"
	id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

// 自动复用 Chunk Scanner 工程的版本号，避免手动同步导致 build 失败。
// 依赖 ../chunkscanner/gradle.properties 中的 mod_version；若路径失效则回退到兜底值。
def csProps = new Properties()
def csPropsFile = file("${rootDir}/../chunkscanner/gradle.properties")
if (csPropsFile.exists()) {
    csProps.load(new FileInputStream(csPropsFile))
    project.ext.chunkscanner_version = csProps['mod_version']
} else {
    project.ext.chunkscanner_version = project.chunkscanner_default_version
}

ext {
    loom_version_manifests = 'https://bmclapi2.bangbang93.com/mc/game/version_manifest_v2.json'
    loom_libraries_base = 'https://bmclapi2.bangbang93.com/libraries/'
    loom_resources_base = 'https://bmclapi2.bangbang93.com/assets/'
}

loom {
    // 使用 BMCLAPI 直接下载版本 JSON，绕过 version manifest
    // 注意：SHA1 前缀可能随 BMCLAPI 更新而变化，若构建失败请检查此 URL
    customMinecraftManifest = 'https://bmclapi2.bangbang93.com/v1/packages/a540b5c5ded34de717f3acc10c9d3704b66670d8/1.20.1.json'
}

repositories {
    maven {
        name = 'BMCLAPI Minecraft Libraries'
        url = 'https://bmclapi2.bangbang93.com/libraries/'
    }
    maven {
        name = 'Fabric'
        url = 'https://maven.fabricmc.net/'
    }
    maven {
        name = 'TerraformersMC'
        url = 'https://maven.terraformersmc.com/'
    }
    maven {
        name = 'Shedaniel'
        url = 'https://maven.shedaniel.me/'
    }
    mavenCentral()
    // Chunk Scanner 本地构建产物（需先 cd ../chunkscanner && sh ./gradlew build）
    flatDir {
        dirs "${rootDir}/../chunkscanner/build/libs"
    }
}

dependencies {
	// To change the versions see the gradle.properties file
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
	modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"

	// Fabric API. This is technically optional, but you probably want it anyway.
	modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

	// Cloth Config / AutoConfig 是必需依赖：
	// AutoConfig 承载模组自身固定配置项，Cloth ConfigBuilder 构建 Feature 动态开关界面
	modImplementation("me.shedaniel.cloth:cloth-config-fabric:${project.cloth_config_version}") {
		exclude(group: "net.fabricmc.fabric-api")
	}

	// ModMenu 为可选依赖：仅编译期需要 API，运行时缺失不影响功能
	modCompileOnly "com.terraformersmc:modmenu:${project.modmenu_version}"

	// Chunk Scanner 为可选依赖：仅编译 builtin.chunkscanner 内置包与其 Mixin 时需要 API，
	// 运行时缺失不影响本模组启动（BuiltinsManager 会跳过该内置包，BdtMixinPlugin 会跳过其 Mixin）。
	// 版本号自动复用 ../chunkscanner/gradle.properties 的 mod_version。
	// 注意：因为是 compileOnly，runClient 开发环境不会自动加载 chunkscanner；
	// 若需联调 builtin.chunkscanner 组件，请手工把 chunkscanner 的 jar 放进 run/mods/。
	modCompileOnly "${project.chunkscanner_group}:${project.chunkscanner_artifact}:${project.chunkscanner_version}"
}

processResources {
	def version = project.version
	inputs.property "version", version

	filesMatching("fabric.mod.json") {
		expand "version": version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 17
}

java {
	// Loom will automatically attach sourcesJar to a RemapSourcesJar task and to the "build" task
	// if it is present.
	// If you remove this line, sources will not be generated.
	withSourcesJar()

	sourceCompatibility = JavaVersion.VERSION_17
	targetCompatibility = JavaVersion.VERSION_17
}

jar {
	def projectName = project.name
	inputs.property "projectName", projectName

	from("LICENSE") {
		rename { "${it}_$projectName"}
	}
}

// configure the maven publication
publishing {
	publications {
		create("mavenJava", MavenPublication) {
			from components.java
		}
	}

	// See https://docs.gradle.org/current/userguide/publishing_maven.html for information on how to set up publishing.
	repositories {
		// Add repositories to publish to here.
		// Notice: This block does NOT have the same function as the block in the top level.
		// The repositories here will be used for publishing your artifact, not for
		// retrieving dependencies.
	}
}
